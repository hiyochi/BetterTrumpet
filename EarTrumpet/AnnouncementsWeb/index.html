<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What's new</title>
<style>
  :root {
    --shell: #050706;
    --text: #F4F7F5;
    --text-2: rgba(244,247,245,.62);
    --text-3: rgba(244,247,245,.48);
    --accent: #9b7bea;
    --accent-strong: #b196f1;
    --accent-weak: rgba(155,123,234,.16);
    --hairline: rgba(255,255,255,.10);
    --hairline-strong: rgba(255,255,255,.14);
    --hairline-weak: rgba(255,255,255,.08);
    --card: rgba(22,18,32,.68);
    --card-solid: #1d1928;
    --r-control: 14px;
    --r-card: 18px;
    --ease-standard: cubic-bezier(.2,0,0,1);
    --ease-decel: cubic-bezier(.33,1,.68,1);
    --font: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0;
    background: #050706;
    color: var(--text);
    user-select: none;
    overflow-x: hidden;
  }

  /* Rounded floating surface (settings-style shell: black frame + panel) */
  .stage {
    position: relative;
    margin: 0 8px 8px;
    border-radius: 18px;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 40% 10%, rgba(190,126,235,.46), transparent 30%),
      linear-gradient(145deg, #47336f 0%, #3b2d8c 35%, #202064 70%, #11123f 100%);
    min-height: calc(100vh - 40px - 12px);
    box-shadow: 0 10px 28px rgba(10,8,15,.25);
  }
  @media (prefers-reduced-transparency: reduce) {
    .stage { background: linear-gradient(145deg, #3d3750, #2a2540); }
    .section { background: var(--card-solid); backdrop-filter: none; }
  }

  /* ---- Ink dither field (crisp pass only; bloom leaks on older WebView2) ---- */
  .dither { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .dither canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dither-crisp { image-rendering: pixelated; opacity: .6; }

  /* ---- Chrome row (settings-style, no native title bar) ---- */
  .chrome {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 12px 0 14px;
    background: #050706;
  }
  .chrome-logo, .chrome-logo img { width: 28px; height: 28px; border-radius: 9px; flex: none; }
  .chrome-logo { box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .chrome-title {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 600; letter-spacing: -.01em;
    color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chrome-actions { display: flex; gap: 4px; }
  .winbtn {
    width: 36px; height: 28px; border-radius: 10px;
    border: none; background: transparent;
    color: rgba(244,247,245,.45);
    display: grid; place-items: center; cursor: pointer;
    transition: background 120ms var(--ease-standard), color 120ms var(--ease-standard);
  }
  .winbtn:hover { background: rgba(255,255,255,.07); color: rgba(244,247,245,.9); }
  .winbtn-close:hover { background: rgba(150,34,26,.55); color: #fff; }
  .winbtn svg { width: 14px; height: 14px; }

  /* ---- Shell + page header ---- */
  .shell { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 12px 22px 14px; }
  .page-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .page-desc { margin: 2px 0 12px; color: var(--text-2); font-size: 12px; }

  /* ---- One section card, accordion rows (settings-style) ---- */
  .section {
    position: relative;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
    backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 28px rgba(10,8,15,.22);
    overflow: hidden;
  }
  .row + .row { border-top: 1px solid rgba(255,255,255,.09); }

  .row-head {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 42px; padding: 0 14px;
    background: none; border: none; color: inherit; font: inherit;
    text-align: left; cursor: pointer;
  }
  .row-open-ind {
    width: 3px; height: 16px; border-radius: 999px; flex: none;
    background: transparent;
  }
  .row.open .row-open-ind { background: var(--accent); box-shadow: 0 0 8px rgba(155,123,234,.55); }
  .row-icon { width: 18px; height: 18px; flex: none; color: rgba(244,247,245,.5); }
  .row-icon svg { width: 18px; height: 18px; }
  .row-main { flex: 1; min-width: 0; }
  .row-title {
    display: block; font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-meta {
    display: flex; gap: 8px; margin-top: 1px;
    font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-3);
  }
  .row-meta .badge { color: var(--accent-strong); }
  .chev {
    width: 16px; height: 16px; flex: none; color: var(--text-3);
    transition: transform 200ms var(--ease-decel);
  }
  .row.open .chev { transform: rotate(180deg); }

  .row-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease-standard); }
  .row.open .row-body { grid-template-rows: 1fr; }
  .row-body > div { overflow: hidden; min-height: 0; }
  .row-panel {
    margin: 0 14px 10px;
    padding: 8px 12px 10px;
    border-radius: var(--r-control);
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.07);
  }

  .row-body .body { margin: 0 0 10px; color: var(--text-2); font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
  .btn-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent-strong); font-size: 13px; font-weight: 600; text-decoration: none;
    background: none; border: none; padding: 4px 0; cursor: pointer; font-family: inherit;
  }
  .btn-link:hover { text-decoration: underline; }

  /* ---- Options (poll/survey) ---- */
  .opt {
    display: flex; align-items: center; gap: 10px; width: 100%;
    min-height: 36px; margin-top: 5px; padding: 0 12px;
    border-radius: var(--r-control);
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
    color: var(--text); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    transition: background 140ms var(--ease-standard), border-color 140ms var(--ease-standard);
  }
  .opt:hover { background: rgba(255,255,255,.07); }
  .opt:active { transform: scale(.99); }
  .opt .dot {
    width: 14px; height: 14px; border-radius: 999px; flex: none;
    border: 1.5px solid rgba(255,255,255,.28);
    transition: background 140ms, border-color 140ms;
  }
  .opt .check { margin-left: auto; width: 14px; height: 14px; opacity: 0; transition: opacity 120ms; flex: none; }
  .opt.sel { background: var(--accent-weak); border-color: rgba(155,123,234,.42); }
  .opt.sel .dot { background: var(--accent); border-color: var(--accent-strong); box-shadow: 0 0 0 3px rgba(155,123,234,.25); }
  .opt.sel .check { opacity: 1; }

  /* ---- Survey questions ---- */
  .q { margin-top: 10px; }
  .q-title { font-size: 12.5px; font-weight: 600; margin: 0 0 2px; }

  /* ---- Results bars ---- */
  .bar-row { margin-top: 10px; }
  .bar-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .bar-label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; min-width: 0; }
  .bar-label span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-label .you {
    flex: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    color: var(--accent-strong); background: var(--accent-weak);
    border: 1px solid rgba(155,123,234,.35); border-radius: 999px; padding: 1px 7px 2px;
  }
  .bar-count { flex: none; font-family: var(--mono); font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
  .bar-fill {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 1px 3px rgba(155,123,234,.3);
    transition: width 460ms var(--ease-decel);
  }

  /* ---- A/B panels ---- */
  .ab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .ab-panel {
    border-radius: var(--r-control); text-align: left;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    padding: 12px; cursor: pointer; color: var(--text); font: inherit;
    transition: background 140ms var(--ease-standard), border-color 140ms var(--ease-standard);
  }
  .ab-panel:hover { background: rgba(255,255,255,.07); }
  .ab-panel:active { transform: scale(.99); }
  .ab-panel.sel { background: var(--accent-weak); border-color: rgba(155,123,234,.5); }
  .ab-panel img { width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; }
  .ab-label {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid var(--hairline);
    font-size: 11px; font-weight: 700; margin-bottom: 8px;
    transition: background 140ms, border-color 140ms, color 140ms;
  }
  .ab-panel.sel .ab-label { background: var(--accent); border-color: var(--accent-strong); color: #0b0d0c; }
  .ab-title { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  .ab-body { font-size: 12px; color: var(--text-2); margin: 0; line-height: 1.5; }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 32px;
    padding: 0 14px; border-radius: var(--r-control);
    border: 1px solid transparent; font: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: background 140ms var(--ease-standard), transform 80ms var(--ease-standard);
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #0b0d0c; margin-top: 10px; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-subtle { background: transparent; color: var(--text-2); padding: 0 6px; min-height: 28px; }
  .btn-subtle:hover { color: var(--text); }
  .row-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .voted-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-top: 10px; }
  .voted-note .dotv { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 8px rgba(155,123,234,.8); flex: none; }

  /* ---- Skeleton ---- */
  .sk-section { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-card); overflow: hidden; }
  .sk-row { padding: 20px; }
  .sk-row + .sk-row { border-top: 1px solid rgba(255,255,255,.06); }
  .sk-line { height: 11px; border-radius: 999px; background: rgba(255,255,255,.07); position: relative; overflow: hidden; }
  .sk-line::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* ---- Empty ---- */
  .empty { text-align: center; padding: 34px 20px; color: var(--text-2); }
  .empty svg { width: 36px; height: 36px; opacity: .4; margin-bottom: 12px; }
  .empty h3 { margin: 0 0 4px; color: var(--text); font-size: 15px; font-weight: 600; }
  .empty p { margin: 0; font-size: 13px; }

  footer {
    position: relative; z-index: 1; max-width: 680px; margin: 4px auto 0;
    padding: 0 28px 10px; color: var(--text-3); font-size: 11px;
    display: flex; justify-content: space-between; gap: 12px;
  }

  /* ---- Entrance (once) + focus + scrollbar ---- */
  .section, .empty { opacity: 0; transform: translateY(8px); animation: cardIn .42s var(--ease-decel) forwards; }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  body.settled .section, body.settled .empty { opacity: 1; transform: none; animation: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 4px rgba(155,123,234,.15); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(155,123,234,.32); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(177,150,241,.55); }

  @media (max-width: 560px) { .ab-grid { grid-template-columns: 1fr; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
    .section, .empty { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="chrome" id="chrome">
    <img class="chrome-logo" src="./icon.png" alt="" />
    <div class="chrome-title" id="title">What's new</div>
    <div class="chrome-actions">
      <button class="winbtn" data-act="minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button class="winbtn winbtn-close" data-act="close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
  </div>

  <div class="stage">
    <div class="dither" aria-hidden="true">
      <canvas class="dither-crisp"></canvas>
    </div>
    <div class="shell">
      <h2 class="page-title" id="pageTitle">What's new</h2>
      <p class="page-desc" id="pageDesc"></p>
      <div id="list"></div>
    </div>
  </div>

  <footer>
    <span>BetterTrumpet</span>
    <span id="footVersion"></span>
  </footer>

<script>
(function () {
  "use strict";

  var labels = {};
  var announcements = [];
  var version = "";
  var votes = {};          // announcementId -> { questionId: optionKey }
  var pending = {};        // announcementId -> { questionId: optionKey } (while choosing)
  var resultsShown = {};   // announcementId -> true once submitted
  var openState = {};      // announcementId -> true when the row is expanded
  var sentRendered = false;

  var listEl = document.getElementById("list");
  var pageTitleEl = document.getElementById("pageTitle");
  var pageDescEl = document.getElementById("pageDesc");
  var titleEl = document.getElementById("title");
  var footVersionEl = document.getElementById("footVersion");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function post(obj) {
    try { window.chrome.webview.postMessage(obj); } catch (e) { /* host unavailable */ }
  }
  function L(key, fallback) { return labels[key] || fallback || key; }

  /* ---------------- Dither (Ink variant 07, crisp pass) ---------------- */
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]]
    .map(function (row) { return row.map(function (v) { return (v + 0.5) / 16; }); });
  var OFF_TIER = 0.4, MAX_COLS = 960, MAX_ROWS = 600, CELL = 2;
  var RGB = [210, 202, 255], FIELD_OPACITY = 0.78, SPEED = 0.021, PHASE = 4.6;

  function sample(x, y, cols, rows, time) {
    var progress = x / Math.max(cols - 1, 1);
    var t = time * SPEED + PHASE;
    var breath = Math.sin(t * 0.38) * 0.01;
    var drift = Math.sin(progress * 9.2 + t) * 0.028;
    var top = (0.4 - Math.sin(progress * Math.PI) * (0.24 + breath) + drift) * rows;
    if (y < top || y >= rows) return null;
    return { density: (y - top) / Math.max(rows - top, 1) };
  }
  function makeStars(cols, rows) {
    var count = Math.max(8, Math.round(cols / 26));
    var stars = [];
    for (var i = 0; stars.length < count && i < count * 4; i += 1) {
      var x = (i * 67 + 13) % cols;
      var y = Math.round((((i * 43 + 19) % 83) / 100) * Math.max(rows - 1, 0));
      var hit = sample(x, y, cols, rows, 0);
      if (hit && hit.density > 0.28) stars.push({ x: x, y: y, phase: (i * 31) % 19 });
    }
    return stars;
  }

  var crisp = document.querySelector(".dither-crisp");
  var ditherHost = document.querySelector(".dither");
  var ctxC = crisp.getContext("2d");
  var frame = 0, timer = 0, stars = [];
  var imageData = null, fieldPixels = null;
  var reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  ditherHost.style.opacity = "1";

  function paintPixel(x, y, alpha) {
    if (!imageData || x < 0 || y < 0 || x >= imageData.width || y >= imageData.height) return;
    var idx = (y * imageData.width + x) * 4;
    var existing = imageData.data[idx + 3] / 255;
    var next = alpha + existing * (1 - alpha);
    imageData.data[idx] = RGB[0];
    imageData.data[idx + 1] = RGB[1];
    imageData.data[idx + 2] = RGB[2];
    imageData.data[idx + 3] = Math.round(next * 255);
  }
  function paintField() {
    if (!imageData) return;
    imageData.data.fill(0);
    var cols = imageData.width, rows = imageData.height;
    for (var y = 0; y < rows; y += 1) {
      for (var x = 0; x < cols; x += 1) {
        var hit = sample(x, y, cols, rows, frame);
        if (!hit) continue;
        var lit = hit.density > BAYER[y & 3][x & 3];
        paintPixel(x, y, (lit ? 0.76 : 0.76 * OFF_TIER) * (0.3 + hit.density * 0.7));
      }
    }
    fieldPixels = new Uint8ClampedArray(imageData.data);
  }
  function drawStars() {
    if (!imageData || !fieldPixels) return;
    imageData.data.set(fieldPixels);
    for (var i = 0; i < stars.length; i += 1) {
      var star = stars[i];
      var twinkle = reducedMotion ? 0.75 : (Math.sin((frame + star.phase) * 0.16) + 1) / 2;
      if (twinkle < 0.55) continue;
      paintPixel(star.x, star.y, twinkle);
      if (twinkle > 0.9) {
        var glint = (twinkle - 0.9) * 6;
        paintPixel(star.x - 1, star.y, glint);
        paintPixel(star.x + 1, star.y, glint);
        paintPixel(star.x, star.y - 1, glint);
        paintPixel(star.x, star.y + 1, glint);
      }
    }
    ctxC.putImageData(imageData, 0, 0);
  }
  function resize() {
    var bounds = ditherHost.getBoundingClientRect();
    var cols = Math.min(MAX_COLS, Math.max(8, Math.round(bounds.width / CELL)));
    var rows = Math.min(MAX_ROWS, Math.max(8, Math.round(bounds.height / CELL)));
    if (cols === crisp.width && rows === crisp.height && imageData && fieldPixels) return;
    crisp.width = cols;
    crisp.height = rows;
    imageData = ctxC.createImageData(cols, rows);
    stars = makeStars(cols, rows);
    paintField();
    drawStars();
  }
  function tick() {
    frame += 1;
    paintField();
    drawStars();
    timer = window.setTimeout(tick, 140);
  }
  function start() {
    resize();
    window.clearTimeout(timer);
    if (!reducedMotion) timer = window.setTimeout(tick, 140);
  }
  new ResizeObserver(function () {
    if (crisp.width > 0) resize();
  }).observe(ditherHost);
  // Paint eagerly on load (observers alone can miss the first frame in some
  // embedded WebView2 contexts), then pause when the panel is off-screen.
  var visible = true;
  new IntersectionObserver(function (entries) {
    visible = entries[0].isIntersecting;
    if (visible) {
      resize();
      window.clearTimeout(timer);
      if (!reducedMotion) timer = window.setTimeout(tick, 140);
    } else {
      window.clearTimeout(timer);
      timer = 0;
    }
  }, { rootMargin: "80px 0px" }).observe(ditherHost);
  start();

  /* ---------------- Icons ---------------- */
  var ICONS = {
    news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-5v12L3 13v-2Z"/><path d="M17 8.5a2.5 2.5 0 1 1 0 7"/><path d="M7.5 13.5v4a1.5 1.5 0 0 0 3 0v-2"/></svg>',
    poll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>',
    survey: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',
    ab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="7" height="16" rx="1.5"/><rect x="13.5" y="4" width="7" height="16" rx="1.5"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4L12 3Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="#b196f1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chevron: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
  };

  /* ---------------- Rendering ---------------- */
  function typeInfo(a) {
    var map = { news: "typeNews", poll: "typePoll", survey: "typeSurvey", ab: "typeAb" };
    return { key: map[a.type] || "typeNews", icon: ICONS[a.type] || ICONS.news };
  }

  function questionOptions(a, qId) {
    if (a.type === "ab") {
      return a.variants.map(function (v) {
        return { key: v.id, label: (v.label ? v.label + " — " : "") + (v.title || v.id) };
      });
    }
    if (a.type === "survey") {
      var q = a.questions.filter(function (x) { return x.id === qId; })[0];
      return (q ? q.options : []).map(function (o) { return { key: o, label: o }; });
    }
    return (a.options || []).map(function (o) { return { key: o, label: o }; });
  }

  function baseResults(a, qId) {
    if (a.type === "survey") {
      return a.questionResults && a.questionResults[qId] ? a.questionResults[qId] : {};
    }
    return a.results || {};
  }

  function resultsFor(a, qId) {
    var base = baseResults(a, qId);
    var mine = (votes[a.id] || {})[qId];
    var rows = questionOptions(a, qId).map(function (o) {
      return { key: o.key, label: o.label, count: (base[o.key] || 0) + (mine === o.key ? 1 : 0), mine: mine === o.key };
    });
    var total = rows.reduce(function (s, r) { return s + r.count; }, 0);
    return { rows: rows, total: total };
  }

  function barsHtml(a, qId) {
    var res = resultsFor(a, qId);
    var youLabel = L("youVoted", "You voted");
    var out = res.rows.map(function (r) {
      var pct = res.total ? Math.round((r.count / res.total) * 100) : 0;
      return '<div class="bar-row">' +
        '<div class="bar-meta">' +
          '<span class="bar-label"><span class="t">' + esc(r.label) + "</span>" +
            (r.mine ? '<span class="you">' + esc(youLabel) + "</span>" : "") + "</span>" +
          '<span class="bar-count">' + r.count + " · " + pct + "%</span></div>" +
        '<div class="bar"><div class="bar-fill" data-w="' + pct + '"></div></div></div>';
    }).join("");
    out += '<div class="bar-row"><div class="bar-meta"><span class="bar-label"><span class="t" style="font-weight:400;color:var(--text-3)">' +
      esc(L("votesFormat", "{0} votes").replace("{0}", String(res.total))) + '</span></span></div></div>';
    return out;
  }

  function optHtml(a, qId, opts) {
    var sel = pending[a.id] || {};
    return opts.map(function (o) {
      return '<button class="opt' + (sel[qId] === o.key ? " sel" : "") + '" data-q="' + esc(qId) + '" data-opt="' + esc(o.key) + '">' +
        '<span class="dot"></span><span>' + esc(o.label) + "</span>" + ICONS.check + "</button>";
    }).join("");
  }

  function isComplete(a) {
    var p = pending[a.id] || {};
    if (a.type === "survey") {
      return a.questions.every(function (q) { return !!p[q.id]; });
    }
    return !!p.choice;
  }

  function bodyContent(a) {
    var voted = !!resultsShown[a.id];
    var parts = [];

    if (a.type === "news") {
      if (a.body) parts.push('<p class="body">' + esc(a.body) + "</p>");
      if (a.link) {
        parts.push('<button class="btn-link" data-link="' + esc(a.link) + '">' +
          esc(L("learnMore", "Learn more")) + " &rarr;</button>");
      }
      return parts.join("");
    }

    if (a.type === "ab") {
      var sel = (pending[a.id] || {}).choice;
      parts.push('<div class="ab-grid">');
      (a.variants || []).forEach(function (v) {
        var img = v.image ? '<img src="' + esc(v.image) + '" alt="" onerror="this.style.display=\'none\'">' : "";
        parts.push(
          '<button class="ab-panel' + (sel === v.id ? " sel" : "") + '" data-v="' + esc(v.id) + '">' +
          '<span class="ab-label">' + esc(v.label || v.id) + "</span>" + img +
          '<p class="ab-title">' + esc(v.title || "") + "</p>" +
          (v.body ? '<p class="ab-body">' + esc(v.body) + "</p>" : "") + "</button>");
      });
      parts.push("</div>");
      if (voted) { parts.push(barsHtml(a, "choice")); parts.push(votedFooter(a)); }
      else parts.push('<button class="btn btn-primary vote-btn" disabled>' + esc(L("vote", "Vote")) + "</button>");
      return parts.join("");
    }

    if (a.type === "survey") {
      (a.questions || []).forEach(function (q) {
        parts.push('<div class="q"><p class="q-title">' + esc(q.text) + "</p>" +
          optHtml(a, q.id, q.options.map(function (o) { return { key: o, label: o }; })) + "</div>");
      });
      if (voted) { (a.questions || []).forEach(function (q) { parts.push(barsHtml(a, q.id)); }); parts.push(votedFooter(a)); }
      else parts.push('<button class="btn btn-primary vote-btn" disabled>' + esc(L("vote", "Vote")) + "</button>");
      return parts.join("");
    }

    // poll
    parts.push(optHtml(a, "choice", (a.options || []).map(function (o) { return { key: o, label: o }; })));
    if (voted) { parts.push(barsHtml(a, "choice")); parts.push(votedFooter(a)); }
    else parts.push('<button class="btn btn-primary vote-btn" disabled>' + esc(L("vote", "Vote")) + "</button>");
    return parts.join("");
  }

  function votedFooter(a) {
    return '<div class="row-actions">' +
      '<span class="voted-note"><span class="dotv"></span>' + esc(L("thanks", "Thanks for voting!")) + "</span>" +
      '<button class="btn btn-subtle change-btn">' + esc(L("change", "Change")) + "</button></div>";
  }

  function rowHtml(a, i) {
    var t = typeInfo(a);
    var open = openState[a.id];
    var meta = '<span>' + esc(L(t.key, t.key)) + "</span>";
    if (a.date) meta += '<span>' + esc(a.date) + "</span>";
    if (a.badge) meta += '<span class="badge">' + esc(a.badge) + "</span>";

    return '<div class="row' + (open ? " open" : "") + '" data-id="' + esc(a.id) + '">' +
      '<button class="row-head" aria-expanded="' + (open ? "true" : "false") + '">' +
        '<span class="row-open-ind"></span>' +
        '<span class="row-icon">' + t.icon + "</span>" +
        '<span class="row-main"><span class="row-title">' + esc(a.title) + "</span>" +
          '<span class="row-meta">' + meta + "</span></span>" +
        ICONS.chevron +
      "</button>" +
      '<div class="row-body"><div class="row-panel">' + bodyContent(a) + "</div></div>" +
    "</div>";
  }

  function render() {
    pageTitleEl.textContent = L("title", "What's new");
    pageDescEl.textContent = L("pageDesc", "");
    titleEl.textContent = L("title", "What's new");
    footVersionEl.textContent = version ? "v" + version : "";

    if (!announcements.length) {
      listEl.innerHTML =
        '<div class="empty">' + ICONS.sparkle +
        "<h3>" + esc(L("emptyTitle", "Nothing new right now")) + "</h3>" +
        "<p>" + esc(L("emptyBody", "News, polls and updates will appear here.")) + "</p></div>";
      finishRender();
      return;
    }

    var html = '<div class="section">';
    announcements.forEach(function (a, i) {
      if (openState[a.id] === undefined) openState[a.id] = i === 0;
      html += rowHtml(a, i);
    });
    html += "</div>";
    listEl.innerHTML = html;

    listEl.querySelectorAll(".row").forEach(function (row) {
      var id = row.getAttribute("data-id");
      row.querySelector(".row-head").addEventListener("click", function () {
        openState[id] = !openState[id];
        render();
      });
      row.querySelectorAll(".opt").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (resultsShown[id]) return;
          var q = btn.getAttribute("data-q"), o = btn.getAttribute("data-opt");
          if (!pending[id]) pending[id] = {};
          if (pending[id][q] === o) delete pending[id][q]; else pending[id][q] = o;
          render();
        });
      });
      row.querySelectorAll(".ab-panel").forEach(function (panel) {
        panel.addEventListener("click", function () {
          if (resultsShown[id]) return;
          var v = panel.getAttribute("data-v");
          if (!pending[id]) pending[id] = {};
          if (pending[id].choice === v) delete pending[id].choice; else pending[id].choice = v;
          render();
        });
      });
      var voteBtn = row.querySelector(".vote-btn");
      if (voteBtn) {
        voteBtn.addEventListener("click", function () {
          votes[id] = pending[id] || {};
          resultsShown[id] = true;
          openState[id] = true;
          post({ type: "vote", id: id, answers: votes[id] });
          render();
        });
      }
      var changeBtn = row.querySelector(".change-btn");
      if (changeBtn) {
        changeBtn.addEventListener("click", function () {
          resultsShown[id] = false;
          pending[id] = votes[id] ? JSON.parse(JSON.stringify(votes[id])) : {};
          render();
        });
      }
      var linkBtn = row.querySelector(".btn-link");
      if (linkBtn) {
        linkBtn.addEventListener("click", function () {
          post({ type: "openUrl", url: linkBtn.getAttribute("data-link") });
        });
      }
    });

    // Disable vote buttons that are incomplete (computed AFTER wiring).
    listEl.querySelectorAll(".vote-btn").forEach(function (btn, i) {
      var row = btn.closest(".row");
      var a = announcements.filter(function (x) { return x.id === row.getAttribute("data-id"); })[0];
      btn.disabled = a ? !isComplete(a) : true;
    });

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        listEl.querySelectorAll(".bar-fill").forEach(function (f) {
          f.style.width = f.getAttribute("data-w") + "%";
        });
      });
    });

    finishRender();
  }

  function finishRender() {
    if (sentRendered) return;
    sentRendered = true;
    window.setTimeout(function () { document.body.classList.add("settled"); }, 850);
    post({ type: "log", msg: "rendered cards=" + announcements.length });
    post({ type: "rendered" });
  }

  /* ---------------- Host bridge ---------------- */
  window.addEventListener("error", function (ev) {
    post({ type: "log", msg: "page error: " + String((ev && (ev.error || ev.message)) || ev) });
  });

  post({ type: "ready" });

  // Settings-style window chrome: ghost buttons post window actions, the
  // chrome row itself is the drag region.
  document.querySelectorAll(".winbtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      post({ type: "windowAction", action: btn.getAttribute("data-act") });
    });
  });
  document.getElementById("chrome").addEventListener("mousedown", function (ev) {
    if (ev.button === 0 && !ev.target.closest(".winbtn")) {
      post({ type: "windowAction", action: "drag" });
    }
  });

  window.chrome.webview.addEventListener("message", function (e) {
    var msg;
    // PostWebMessageAsJson may deliver e.data as an already-parsed object on
    // some WebView2 runtimes, or as a JSON string on others. Accept both.
    try {
      msg = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    } catch (err) {
      post({ type: "log", msg: "parse failed: " + err.message });
      return;
    }
    if (msg.type !== "announcements" || !msg.data) return;
    post({ type: "log", msg: "got announcements" });

    labels = msg.data.labels || {};
    version = msg.data.version || "";
    var fresh = msg.data.announcements || [];
    fresh.forEach(function (a) {
      if (a.localVote && Object.keys(a.localVote).length) {
        votes[a.id] = a.localVote;
        resultsShown[a.id] = true;
      }
    });
    announcements = fresh;
    render();
  });
})();
</script>
</body>
</html>
